# Listens on UDP 514 and stores logs from all internal network nodes

@version: 4.0

options {
    flush_lines(0);
    time_reopen(10);
    log_fifo_size(1000);
    chain_hostnames(off);
    use_dns(no);
    use_fqdn(no);
    create_dirs(yes);
    keep_hostname(yes);
};

# Listen for logs over UDP 514 — IPv4
source s_udp {
    network(
        transport("udp")
        port(514)
        ip("0.0.0.0")
        ip-protocol(4)
    );
};

# Listen for logs over UDP 514 — IPv6
source s_udp6 {
    network(
        transport("udp")
        port(514)
        ip("::")
        ip-protocol(6)
    );
};

# Lsocal logs from this container
source s_local {
    system();
    internal();
};

# Store logs from remote hosts in separate files per host
destination d_remote {
    file(
        "/var/log/remote/${HOST}.log"
        create_dirs(yes)
    );
};

# Store local logs
destination d_local {
    file("/var/log/syslog-ng/local.log");
};

# Wire sources to destinations
log { source(s_udp);  destination(d_remote); };
log { source(s_udp6); destination(d_remote); };
log { source(s_local); destination(d_local); };
