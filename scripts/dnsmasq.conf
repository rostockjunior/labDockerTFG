no-hosts
no-resolv

local=/WebDelLaboratorio.com/

address=/WebDelLaboratorio.com/192.168.4.2
address=/vpn.WebDelLaboratorio.com/192.168.3.3

# Upstream para lab-external.com: IP inexistente en la red del lab.
# dnsmasq reenvía queries de este dominio a esa IP (sin respuesta real).
# El ataque de Kaminsky aprovecha esta ventana para envenenar el cache.
server=/lab-external.com/192.168.5.200

# Puerto fijo de salida para queries upstream (simula dnsmasq sin randomizacion
# de puerto fuente, la vulnerabilidad original del ataque de Kaminsky).
query-port=5353
